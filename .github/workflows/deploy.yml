name: Deploy self-hosted production

# Called only by Release after all publishers and completeness checks succeed.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: multica-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'quboqin/multica'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/check-release-origin.sh "$RELEASE_TAG"
      - name: Transfer tagged deployment files and upgrade
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GITHUB_APP_SLUG: ${{ vars.MULTICA_GITHUB_APP_SLUG }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.MULTICA_GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_CLIENT_ID: ${{ vars.MULTICA_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.MULTICA_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_APP_ID: ${{ vars.MULTICA_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MULTICA_GITHUB_APP_PRIVATE_KEY }}
          MULTICA_TELEGRAM_SECRET_KEY: ${{ secrets.MULTICA_TELEGRAM_SECRET_KEY }}
          MULTICA_WECOM_SECRET_KEY: ${{ secrets.MULTICA_WECOM_SECRET_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ && "$DEPLOY_PORT" -le 65535 ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          trap 'rm -f "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/integrations.json"' EXIT
          python3 scripts/deploy-selfhost-env.py capture "$RUNNER_TEMP/deploy-ssh/integrations.json"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          opts=(-i "$RUNNER_TEMP/deploy-ssh/key" -o "Port=$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir=$(ssh "${opts[@]}" "$target" 'mktemp -d /tmp/multica-release.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/multica-release\.[a-zA-Z0-9]+$ ]]
          trap 'ssh "${opts[@]}" "$target" "rm -rf -- $remote_dir" || true; rm -f "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/integrations.json"' EXIT
          scp "${opts[@]}" scripts/deploy-selfhost.sh scripts/check-collection-db-compat.sql scripts/deploy-selfhost-env.py docker-compose.selfhost.yml "$RUNNER_TEMP/deploy-ssh/integrations.json" "$target:$remote_dir/"
          printf -v command 'bash %q %q %q %q %q' "$remote_dir/deploy-selfhost.sh" "$RELEASE_TAG" "$(git rev-parse HEAD)" "$DEPLOY_PATH" "$remote_dir/integrations.json"
          ssh "${opts[@]}" "$target" "$command"
