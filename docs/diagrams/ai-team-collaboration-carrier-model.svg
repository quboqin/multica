<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="title desc">
  <title id="title">需求协作承载模型</title>
  <desc id="desc">需求进入后，由 Project 承载交付目标，由父 Issue 承载编排主线程，由子 Issue 承载各阶段 Agent 工作包，人类在关键节点 Review 和确认。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .section-title { font-size: 18px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .status { font-size: 11px; fill: #4b5563; }
    .node { stroke-width: 1.5; }
    .shadow { filter: url(#softShadow); }
  </style>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1280" height="780" fill="#ffffff"/>

  <text x="64" y="58" class="title">需求协作承载模型</text>
  <text x="64" y="88" class="subtitle">Project 管交付目标，父 Issue 管编排主线程，子 Issue 管阶段工作包，Agent Task 执行，人类在关键节点 Review 和确认。</text>

  <!-- Requirement input -->
  <g transform="translate(64 182)" class="shadow">
    <rect x="0" y="0" width="150" height="116" rx="12" fill="#ffffff" stroke="#d1d5db" class="node"/>
    <text x="75" y="45" text-anchor="middle" class="label">需求进入</text>
    <text x="75" y="71" text-anchor="middle" class="small">PRD / 业务诉求</text>
  </g>

  <path d="M214 240 H320" stroke="#2563eb" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="258" y="208" text-anchor="middle" class="small">创建容器</text>
  <text x="258" y="226" text-anchor="middle" class="tiny">Project + 父 Issue</text>

  <!-- Main carrier stack -->
  <g transform="translate(320 128)">
    <rect x="0" y="0" width="684" height="610" rx="18" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="30" y="40" class="section-title">一个需求在 Cybertron 里的四层承载</text>
    <text x="30" y="65" class="small">越往上越偏交付治理，越往下越偏执行记录和产物。</text>

    <!-- Project layer -->
    <g transform="translate(30 98)">
      <rect x="0" y="0" width="624" height="96" rx="12" fill="#eff6ff" stroke="#bfdbfe" class="node"/>
      <text x="26" y="35" class="label">Project：承载交付目标</text>
      <text x="26" y="60" class="small">目标、范围、里程碑、整体进度、交付结果</text>
      <text x="468" y="37" class="status">例：支付链路改造</text>
      <text x="468" y="60" class="status">状态：in_progress</text>
    </g>

    <!-- Parent issue layer -->
    <g transform="translate(30 222)">
      <rect x="0" y="0" width="624" height="102" rx="12" fill="#faf5ff" stroke="#e9d5ff" class="node"/>
      <text x="26" y="37" class="label">父 Issue：承载编排主线程</text>
      <text x="26" y="63" class="small">Squad Leader 跟进主线，拆分子 Issue，汇总阶段结论</text>
      <text x="468" y="39" class="status">Assignee：Squad</text>
      <text x="468" y="63" class="status">状态：in_review / done</text>
    </g>

    <!-- Child issue layer -->
    <g transform="translate(30 354)">
      <rect x="0" y="0" width="624" height="134" rx="12" fill="#f0fdf4" stroke="#bbf7d0" class="node"/>
      <text x="26" y="35" class="label">子 Issue：承载各阶段 Agent 工作包</text>
      <text x="26" y="60" class="small">每个工作包都有明确 assignee、产物、Review 门禁和状态。</text>
      <g transform="translate(26 82)">
        <rect x="0" y="0" width="88" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="44" y="24" text-anchor="middle" class="tiny">需求对齐</text>
        <rect x="104" y="0" width="88" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="148" y="24" text-anchor="middle" class="tiny">技术设计</text>
        <rect x="208" y="0" width="88" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="252" y="24" text-anchor="middle" class="tiny">Coding</text>
        <rect x="312" y="0" width="88" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="356" y="24" text-anchor="middle" class="tiny">测试</text>
        <rect x="416" y="0" width="88" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="460" y="24" text-anchor="middle" class="tiny">Fix</text>
        <rect x="520" y="0" width="78" height="38" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="559" y="24" text-anchor="middle" class="tiny">发布</text>
      </g>
    </g>

    <!-- Agent task layer -->
    <g transform="translate(30 518)">
      <rect x="0" y="0" width="624" height="76" rx="12" fill="#fff7ed" stroke="#fed7aa" class="node"/>
      <text x="26" y="32" class="label">Agent Task：执行与产物记录</text>
      <text x="26" y="57" class="small">一次 Agent 调用产生报告、代码、测试报告、发布计划等可审查产物。</text>
      <text x="462" y="35" class="status">同一 Issue 可多次调用 Agent</text>
    </g>

    <!-- Vertical arrows -->
    <path d="M342 194 V222" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="360" y="211" class="tiny">目标落主线</text>
    <path d="M342 324 V354" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="360" y="342" class="tiny">主线拆工作包</text>
    <path d="M342 488 V518" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="360" y="506" class="tiny">工作包触发执行</text>
  </g>

  <!-- Human review gate -->
  <g transform="translate(1042 146)">
    <rect x="0" y="0" width="184" height="572" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" class="shadow"/>
    <text x="92" y="37" text-anchor="middle" class="section-title">人类 Review</text>
    <text x="92" y="62" text-anchor="middle" class="small">关键节点确认</text>
    <path d="M42 88 V500" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>

    <g transform="translate(22 112)">
      <circle cx="20" cy="20" r="13" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <text x="54" y="18" class="label">需求确认</text>
      <text x="54" y="39" class="tiny">对齐报告可接受</text>
    </g>
    <g transform="translate(22 198)">
      <circle cx="20" cy="20" r="13" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <text x="54" y="18" class="label">设计确认</text>
      <text x="54" y="39" class="tiny">方案和任务拆分通过</text>
    </g>
    <g transform="translate(22 284)">
      <circle cx="20" cy="20" r="13" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <text x="54" y="18" class="label">代码评审</text>
      <text x="54" y="39" class="tiny">实现满足设计和 PRD</text>
    </g>
    <g transform="translate(22 370)">
      <circle cx="20" cy="20" r="13" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <text x="54" y="18" class="label">测试确认</text>
      <text x="54" y="39" class="tiny">报告确认后拆 Fix</text>
    </g>
    <g transform="translate(22 456)">
      <circle cx="20" cy="20" r="13" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
      <text x="54" y="18" class="label">发布确认</text>
      <text x="54" y="39" class="tiny">确认后 Agent 执行</text>
    </g>

    <text x="92" y="538" text-anchor="middle" class="tiny">Approve = in_review → done</text>
  </g>

  <!-- Review and status arrows -->
  <path d="M974 458 H1038" stroke="#ea580c" stroke-width="2.6" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="1006" y="438" text-anchor="middle" class="tiny">提交 Review</text>
  <path d="M1038 626 H974" stroke="#6b7280" stroke-width="2.1" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowGray)"/>
  <text x="1006" y="606" text-anchor="middle" class="tiny">状态回写</text>

</svg>
