<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">AI 使用形态的三阶段演进</title>
  <desc id="desc">展示 AI 使用从个人长窗口，到窗口里的 Skill 工作流，再到 Cybertron 协作工作流的演进路径。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .stage { font-size: 15px; font-weight: 700; fill: #4b5563; }
    .panel-title { font-size: 22px; font-weight: 700; }
    .section-title { font-size: 16px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .code { font-size: 11px; fill: #374151; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
    .node { stroke-width: 1.5; }
    .soft { filter: url(#softShadow); }
  </style>
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>

  <text x="64" y="58" class="title">AI 使用形态的三阶段演进</text>
  <text x="64" y="88" class="subtitle">从一个人的连续聊天，到窗口里的 Skill 流程，再到 Cybertron 里可协作、可调度、可审计的团队工作流。</text>

  <!-- Stage 1 -->
  <g transform="translate(64 132)">
    <rect x="0" y="0" width="330" height="510" rx="18" fill="#fff7ed" stroke="#fed7aa" class="node soft"/>
    <text x="28" y="38" class="stage">阶段 1</text>
    <text x="28" y="70" class="panel-title">个人长窗口</text>
    <text x="28" y="96" class="small">一个人和一个 AI 窗口持续对话</text>

    <g transform="translate(28 126)">
      <rect x="0" y="0" width="274" height="106" rx="12" fill="#ffffff" stroke="#fed7aa"/>
      <text x="20" y="30" class="section-title">窗口就是工作现场</text>
      <text x="20" y="56" class="small">问题、上下文、思路都留在同一段对话里</text>
      <text x="20" y="82" class="code">human ↔ codex / claude</text>
    </g>

    <g transform="translate(28 262)">
      <text x="0" y="0" class="label">适合</text>
      <rect x="0" y="20" width="124" height="38" rx="8" fill="#ffffff" stroke="#fed7aa"/>
      <text x="62" y="44" text-anchor="middle" class="tiny">问问题</text>
      <rect x="150" y="20" width="124" height="38" rx="8" fill="#ffffff" stroke="#fed7aa"/>
      <text x="212" y="44" text-anchor="middle" class="tiny">Debug</text>
      <rect x="0" y="72" width="124" height="38" rx="8" fill="#ffffff" stroke="#fed7aa"/>
      <text x="62" y="96" text-anchor="middle" class="tiny">解释代码</text>
      <rect x="150" y="72" width="124" height="38" rx="8" fill="#ffffff" stroke="#fed7aa"/>
      <text x="212" y="96" text-anchor="middle" class="tiny">探索方案</text>
    </g>

    <g transform="translate(28 412)">
      <rect x="0" y="0" width="274" height="58" rx="10" fill="#fffaf5" stroke="#fed7aa"/>
      <text x="18" y="25" class="label">主要局限</text>
      <text x="18" y="44" class="tiny">流程、状态、责任和产物都靠人自己维护</text>
    </g>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(475 132)">
    <rect x="0" y="0" width="330" height="510" rx="18" fill="#eff6ff" stroke="#bfdbfe" class="node soft"/>
    <text x="28" y="38" class="stage">阶段 2</text>
    <text x="28" y="70" class="panel-title">窗口里的 Skill 工作流</text>
    <text x="28" y="96" class="small">长窗口里开始运行固定流程和产物模板</text>

    <g transform="translate(28 126)">
      <rect x="0" y="0" width="274" height="242" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="20" y="30" class="section-title">以需求对齐 Skill 为例</text>
      <g transform="translate(20 54)">
        <rect x="0" y="0" width="234" height="30" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="20" text-anchor="middle" class="tiny">读 PRD</text>
        <path d="M117 30 V48" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrowBlue)"/>
        <rect x="0" y="50" width="234" height="30" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="70" text-anchor="middle" class="tiny">澄清问题 / 系统现状</text>
        <path d="M117 80 V98" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrowBlue)"/>
        <rect x="0" y="100" width="234" height="30" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="120" text-anchor="middle" class="tiny">边界 / 风险 / 验收点</text>
        <path d="M117 130 V148" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrowBlue)"/>
        <rect x="0" y="150" width="234" height="30" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="170" text-anchor="middle" class="tiny">输出对齐报告</text>
      </g>
    </g>

    <g transform="translate(28 398)">
      <rect x="0" y="0" width="274" height="72" rx="10" fill="#f8fbff" stroke="#bfdbfe"/>
      <text x="18" y="25" class="label">关键变化</text>
      <text x="18" y="44" class="tiny">AI 不只是聊天，而是在窗口里执行工作包雏形</text>
      <text x="18" y="61" class="tiny">但状态和协作仍主要停留在窗口内</text>
    </g>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(886 132)">
    <rect x="0" y="0" width="330" height="510" rx="18" fill="#f0fdf4" stroke="#bbf7d0" class="node soft"/>
    <text x="28" y="38" class="stage">阶段 3</text>
    <text x="28" y="70" class="panel-title">Cybertron 协作工作流</text>
    <text x="28" y="96" class="small">把窗口工作流外化成团队协作对象</text>

    <g transform="translate(28 126)">
      <rect x="0" y="0" width="274" height="270" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="20" y="30" class="section-title">协作对象承载流程</text>
      <g transform="translate(20 56)">
        <rect x="0" y="0" width="234" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="22" text-anchor="middle" class="tiny">Project：交付目标</text>
        <path d="M117 34 V50" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#arrowGray)"/>
        <rect x="0" y="52" width="234" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="74" text-anchor="middle" class="tiny">父 Issue：长期协作主线程</text>
        <path d="M117 86 V102" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#arrowGray)"/>
        <rect x="0" y="104" width="234" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="126" text-anchor="middle" class="tiny">子 Issue：阶段工作包</text>
        <path d="M117 138 V154" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#arrowGray)"/>
        <rect x="0" y="156" width="234" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
        <text x="117" y="178" text-anchor="middle" class="tiny">Agent Task：一次短周期执行</text>
      </g>
    </g>

    <g transform="translate(28 424)">
      <rect x="0" y="0" width="274" height="46" rx="10" fill="#f7fff9" stroke="#bbf7d0"/>
      <text x="18" y="28" class="label">结果：团队可协作、可调度、可审计</text>
    </g>
  </g>

  <!-- Stage arrows -->
  <path d="M394 382 H475" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="434" y="356" text-anchor="middle" class="tiny">沉淀流程</text>
  <path d="M805 382 H886" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="846" y="356" text-anchor="middle" class="tiny">产品化协作对象</text>

  <!-- Bottom summary -->
  <g transform="translate(96 682)">
    <rect x="0" y="0" width="1088" height="44" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="32" y="28" class="small">一句话：</text>
    <text x="98" y="28" class="small">长窗口解决个人连续上下文</text>
    <path d="M284 22 H344" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="366" y="28" class="small">Skill 让长窗口变成个人工作流</text>
    <path d="M584 22 H644" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="666" y="28" class="small">Cybertron 把个人工作流升级为团队协作系统</text>
  </g>
</svg>
