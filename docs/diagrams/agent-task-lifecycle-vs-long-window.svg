<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">长期协作，短周期执行</title>
  <desc id="desc">展示 Issue 作为长期协作线程承载上下文，Agent Task 作为短周期执行单元按任务启动、执行和释放。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .panel-title { font-size: 20px; font-weight: 700; }
    .panel-subtitle { font-size: 13px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .code { font-size: 12px; fill: #374151; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
    .node { stroke-width: 1.5; }
    .soft { filter: url(#softShadow); }
  </style>
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>

  <text x="64" y="58" class="title">长期协作，短周期执行</text>
  <text x="64" y="88" class="subtitle">Issue 承载持续协作上下文，Agent Task 按任务启动、执行、释放；状态长期存在，进程短周期运行。</text>

  <!-- Left panel: long-lived issue thread -->
  <g transform="translate(64 128)">
    <rect x="0" y="0" width="540" height="540" rx="18" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" class="soft"/>
    <text x="28" y="42" class="panel-title">Issue：长期协作</text>
    <text x="28" y="68" class="panel-subtitle">一个需求在 Issue 里持续澄清、沉淀产物、推进状态。</text>

    <g transform="translate(52 104)">
      <rect x="0" y="0" width="436" height="128" rx="14" fill="#ffffff" stroke="#d1d5db" class="node"/>
      <text x="24" y="36" class="label">父 Issue / 子 Issue Thread</text>
      <text x="24" y="62" class="small">人类和 agent 持续在评论里澄清、确认、补充上下文</text>
      <text x="24" y="88" class="small">状态、产物、Review 结论都沉淀在同一个工作单元里</text>
      <text x="24" y="112" class="code">issue + comments + status + artifacts</text>
    </g>

    <g transform="translate(86 274)">
      <rect x="0" y="0" width="120" height="48" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="60" y="30" text-anchor="middle" class="tiny">评论澄清</text>
      <rect x="156" y="0" width="120" height="48" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="216" y="30" text-anchor="middle" class="tiny">状态推进</text>
      <rect x="312" y="0" width="120" height="48" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="372" y="30" text-anchor="middle" class="tiny">产物沉淀</text>
      <path d="M120 24 H156" stroke="#6b7280" stroke-width="1.7" fill="none" marker-end="url(#arrowGray)"/>
      <path d="M276 24 H312" stroke="#6b7280" stroke-width="1.7" fill="none" marker-end="url(#arrowGray)"/>
    </g>

    <path d="M270 232 V274" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowGray)"/>
    <text x="290" y="258" class="tiny">同一 Issue 持续承载上下文</text>

    <g transform="translate(52 372)">
      <rect x="0" y="0" width="436" height="118" rx="14" fill="#fff7ed" stroke="#fed7aa" class="node"/>
      <text x="24" y="34" class="label">它负责什么</text>
      <text x="24" y="62" class="small">承载长期协作事实：需求、评论、状态、产物、Review 决策。</text>
      <text x="24" y="86" class="small">不负责让 AI 进程常驻；执行由一次次 Agent Task 完成。</text>
    </g>
  </g>

  <!-- Right panel: short task lifecycle -->
  <g transform="translate(676 128)">
    <rect x="0" y="0" width="540" height="540" rx="18" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" class="soft"/>
    <text x="28" y="42" class="panel-title">Agent Task：短周期执行</text>
    <text x="28" y="68" class="panel-subtitle">每次任务临时启动进程，结束释放；上下文沉淀在系统对象里。</text>

    <g transform="translate(36 106)">
      <rect x="0" y="0" width="104" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" class="node"/>
      <text x="52" y="24" text-anchor="middle" class="tiny">Issue / @agent</text>
      <text x="52" y="42" text-anchor="middle" class="tiny">触发</text>

      <rect x="144" y="0" width="104" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" class="node"/>
      <text x="196" y="24" text-anchor="middle" class="tiny">Agent Task</text>
      <text x="196" y="42" text-anchor="middle" class="tiny">queued</text>

      <rect x="288" y="0" width="104" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" class="node"/>
      <text x="340" y="24" text-anchor="middle" class="tiny">daemon</text>
      <text x="340" y="42" text-anchor="middle" class="tiny">claim</text>

      <rect x="432" y="0" width="72" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" class="node"/>
      <text x="468" y="24" text-anchor="middle" class="tiny">start</text>
      <text x="468" y="42" text-anchor="middle" class="tiny">Codex</text>

      <path d="M104 29 H144" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M248 29 H288" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M392 29 H432" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    </g>

    <g transform="translate(52 206)">
      <rect x="0" y="0" width="436" height="104" rx="14" fill="#ffffff" stroke="#d1d5db" class="node"/>
      <text x="24" y="32" class="label">一次真实执行</text>
      <text x="24" y="58" class="code">codex app-server --listen stdio://</text>
      <text x="24" y="82" class="code">[daemon 默认参数] [agent custom_args]</text>
    </g>

    <path d="M504 164 V184 H270 V206" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

    <g transform="translate(52 354)">
      <rect x="0" y="0" width="194" height="112" rx="14" fill="#f0fdf4" stroke="#bbf7d0" class="node"/>
      <text x="20" y="34" class="label">释放进程</text>
      <text x="20" y="60" class="small">跑完后退出</text>
      <text x="20" y="84" class="small">资源和权限收回</text>
    </g>

    <g transform="translate(294 354)">
      <rect x="0" y="0" width="194" height="112" rx="14" fill="#faf5ff" stroke="#e9d5ff" class="node"/>
      <text x="20" y="34" class="label">保存上下文</text>
      <text x="20" y="60" class="small">Issue / Comment</text>
      <text x="20" y="84" class="small">session_id / work_dir</text>
    </g>

    <path d="M270 310 V338 H149 V354" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    <path d="M270 310 V338 H391 V354" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

    <path d="M391 466 V500 H196 V484" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowPurple)"/>
    <text x="292" y="522" text-anchor="middle" class="tiny">下次同一 issue 继续时，按保存的上下文恢复</text>
  </g>

  <!-- Bottom value strip -->
  <g transform="translate(64 692)">
    <rect x="0" y="0" width="1152" height="40" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="34" y="25" class="small">短周期价值：</text>
    <text x="126" y="25" class="small">资源可控</text>
    <circle cx="204" cy="21" r="3" fill="#9ca3af"/>
    <text x="222" y="25" class="small">任务边界清楚</text>
    <circle cx="330" cy="21" r="3" fill="#9ca3af"/>
    <text x="348" y="25" class="small">失败可追踪和重试</text>
    <circle cx="488" cy="21" r="3" fill="#9ca3af"/>
    <text x="506" y="25" class="small">适合队列并发</text>
    <circle cx="622" cy="21" r="3" fill="#9ca3af"/>
    <text x="640" y="25" class="small">每次可切模型和参数</text>
    <circle cx="810" cy="21" r="3" fill="#9ca3af"/>
    <text x="828" y="25" class="small">Review 和产物沉淀在 Issue 里</text>
  </g>
</svg>
