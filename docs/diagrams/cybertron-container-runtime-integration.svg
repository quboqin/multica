<text x="142" y="713" class="chip">Docker 容器 B</text>
<text x="310" y="713" class="tiny">Codex / Tools</text>
<rect x="124" y="732" width="314" height="28" rx="8" fill="#f9fafb" stroke="#d1d5db" class="node"/>
<text x="142" y="751" class="chip">Docker 容器 C</text>
<text x="310" y="751" class="tiny">Skills / Plugins</text>
<rect x="124" y="770" width="314" height="28" rx="8" fill="#f9fafb" stroke="#d1d5db" class="node"/>
<text x="142" y="789" class="chip">Docker 容器 N</text>
<text x="310" y="789" class="tiny">Workspace 挂载</text>
<rect x="124" y="796" width="314" height="16" rx="6" fill="#ffffff" stroke="#e5e7eb" class="node"/>
