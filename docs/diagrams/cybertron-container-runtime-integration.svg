<text x="96" y="942" class="section-title">任务执行链路</text>
<text x="96" y="968" class="small">业务动作进入 Cybertron Service，Daemon 从队列领取任务，在 Docker 容器内调用 LLM Runtime，最后把结果回写到 Cybertron。</text>
<rect x="1182" y="917" width="492" height="34" rx="17" fill="#f9fafb" stroke="#e5e7eb" class="node"/>
