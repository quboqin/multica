<text x="212" y="546" class="box-title">Runtime Agent 1</text>
<text x="114" y="576" class="small">马来云区域 A</text>
<rect x="116" y="604" width="150" height="32" rx="9" fill="#f0fdf4" stroke="#86efac" class="node"/>
<text x="191" y="625" class="tiny" text-anchor="middle">Runtime Agent</text>
<rect x="296" y="604" width="150" height="32" rx="9" fill="#f0fdf4" stroke="#86efac" class="node"/>
<text x="371" y="625" class="tiny" text-anchor="middle">Docker Engine</text>
<rect x="124" y="656" width="314" height="28" rx="8" fill="#eff6ff" stroke="#d1d5db" class="node"/>
<text x="142" y="675" class="chip">Docker 容器 A</text>
<text x="310" y="675" class="tiny">LLM Runtime</text>
