<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" width="1800" height="1120" role="img" aria-labelledby="title desc">
  <title id="title">Cybertron 容器云运行时架构</title>
  <desc id="desc">中文架构图，展示 Cybertron 四个组成部分、四台虚拟机 Runtime Agent，以及每台虚拟机中的多个 Docker Runtime 容器。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif; fill: #111827; }
    .code { font-family: Consolas, "SFMono-Regular", Menlo, "Microsoft YaHei", monospace; font-size: 10px; fill: #374151; }
    .title { font-size: 34px; font-weight: 760; }
    .subtitle { font-size: 16px; fill: #4b5563; }
    .section-title { font-size: 21px; font-weight: 760; }
    .card-title { font-size: 19px; font-weight: 760; }
    .box-title { font-size: 15px; font-weight: 740; }
    .label { font-size: 13px; font-weight: 720; }
    .small { font-size: 13px; fill: #374151; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .pill { font-size: 11px; fill: #374151; font-weight: 760; }
    .chip { font-size: 12px; fill: #111827; font-weight: 700; }
    .node { stroke-width: 1.5; }
    .soft { filter: url(#softShadow); }
  </style>
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="122%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#111827" flood-opacity="0.07"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
  </defs>
  <rect width="1800" height="1120" fill="#ffffff"/>
<text x="64" y="58" class="title">Cybertron 容器云运行时架构</text>
<text x="64" y="92" class="subtitle">Cybertron 由一个前端和三个可执行程序组成；Daemon 连接 Cybertron Service 与 LLM Runtime，并把任务交给容器云执行。</text>
<rect x="64" y="128" width="1672" height="242" rx="22" fill="#f9fafb" stroke="#e5e7eb" class="node soft"/>
<text x="96" y="166" class="section-title">Cybertron 四部分</text>
<rect x="1418" y="144" width="250" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" class="node"/>
<text x="1543" y="164" class="pill" text-anchor="middle">1 个前端 + 3 个可执行程序</text>
<rect x="96" y="194" width="344" height="132" rx="20" fill="#eff6ff" stroke="#93c5fd" class="node soft"/>
<rect x="118" y="216" width="112" height="28" rx="9" fill="#ffffff" stroke="#93c5fd" class="node"/>
<text x="174" y="235" class="pill" text-anchor="middle">前端服务</text>
<text x="118" y="272" class="card-title">Cybertron Web</text>
<text x="118" y="300" class="small">用户操作入口</text>
<text x="118" y="322" class="tiny">任务、评论、看板、协作</text>
<rect x="500" y="194" width="344" height="132" rx="20" fill="#fff7ed" stroke="#fed7aa" class="node soft"/>
<rect x="522" y="216" width="112" height="28" rx="9" fill="#ffffff" stroke="#fed7aa" class="node"/>
<text x="578" y="235" class="pill" text-anchor="middle">服务端程序</text>
<text x="522" y="272" class="card-title">Cybertron Service</text>
<text x="522" y="300" class="small">管理业务状态</text>
<text x="522" y="322" class="tiny">账号、Workspace、队列、审计</text>
<rect x="904" y="194" width="344" height="132" rx="20" fill="#faf5ff" stroke="#d8b4fe" class="node soft"/>
<rect x="926" y="216" width="112" height="28" rx="9" fill="#ffffff" stroke="#d8b4fe" class="node"/>
<text x="982" y="235" class="pill" text-anchor="middle">守护进程</text>
<text x="926" y="272" class="card-title">Cybertron Daemon</text>
<text x="926" y="300" class="small">连接 Service 和 Runtime</text>
<text x="926" y="322" class="tiny">领取任务、启动容器、回传结果</text>
<rect x="1308" y="194" width="344" height="132" rx="20" fill="#f0fdfa" stroke="#99f6e4" class="node soft"/>
<rect x="1330" y="216" width="112" height="28" rx="9" fill="#ffffff" stroke="#99f6e4" class="node"/>
<text x="1386" y="235" class="pill" text-anchor="middle">AI 执行程序</text>
<text x="1330" y="272" class="card-title">LLM Runtime</text>
<text x="1330" y="300" class="small">在容器中运行模型工具链</text>
<text x="1330" y="322" class="tiny">Codex、Skills、Tools、Workspace</text>
<line x1="440" y1="260" x2="500" y2="260" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
<text x="470" y="245" class="tiny" text-anchor="middle">访问</text>
<line x1="844" y1="260" x2="904" y2="260" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
<text x="874" y="245" class="tiny" text-anchor="middle">任务 / 状态</text>
<line x1="1248" y1="260" x2="1308" y2="260" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrowPurple)"/>
<text x="1278" y="245" class="tiny" text-anchor="middle">桥接</text>
<line x1="1480" y1="326" x2="1480" y2="402" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrowPurple)"/>
<text x="1510" y="374" class="tiny">容器化运行</text>
<rect x="64" y="402" width="1672" height="466" rx="22" fill="#f0fdf4" stroke="#86efac" class="node soft"/>
<text x="96" y="442" class="section-title">Runtime Agent 容器云</text>
<text x="96" y="468" class="small">当前为 4 台虚拟机。每台 VM 都运行 Runtime Agent，并通过 Docker 启动多个隔离的 LLM Runtime 容器。</text>
