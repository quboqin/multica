<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Cybertron 三平面架构</title>
  <desc id="desc">Cybertron 三平面架构：协作平面负责长期状态，执行平面负责短周期任务，治理平面负责权限、配置和审计。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .plane-title { font-size: 22px; font-weight: 700; }
    .section-title { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .pill { font-size: 12px; fill: #374151; }
    .node { stroke-width: 1.5; }
    .soft { filter: url(#softShadow); }
  </style>
  <defs>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="138%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#9333ea"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>

  <text x="64" y="58" class="title">Cybertron 三平面架构</text>
  <text x="64" y="88" class="subtitle">把团队协作、Agent 执行和治理能力分开看：状态长期沉淀，任务短周期执行，治理贯穿全链路。</text>

  <!-- Governance plane -->
  <g transform="translate(174 132)">
    <rect x="0" y="0" width="932" height="116" rx="18" fill="#f3f4f6" stroke="#d1d5db" class="node soft"/>
    <text x="30" y="39" class="plane-title">治理平面</text>
    <text x="30" y="65" class="small">统一约束协作和执行：权限、Agent 可用性、Runtime 注册、审计记录。</text>
    <g transform="translate(430 30)">
      <rect x="0" y="0" width="106" height="38" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="53" y="24" text-anchor="middle" class="pill">Workspace</text>
      <rect x="122" y="0" width="106" height="38" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="175" y="24" text-anchor="middle" class="pill">Permission</text>
      <rect x="244" y="0" width="106" height="38" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="297" y="24" text-anchor="middle" class="pill">Registry</text>
      <rect x="366" y="0" width="106" height="38" rx="8" fill="#ffffff" stroke="#d1d5db"/>
      <text x="419" y="24" text-anchor="middle" class="pill">Audit</text>
    </g>
  </g>

  <!-- Collaboration plane -->
  <g transform="translate(112 342)">
    <rect x="0" y="0" width="450" height="236" rx="20" fill="#eff6ff" stroke="#93c5fd" class="node soft"/>
    <text x="30" y="44" class="plane-title">协作平面</text>
    <text x="30" y="72" class="small">面向团队和看板，负责长期状态、上下文、产物和人类确认。</text>

    <g transform="translate(30 106)">
      <rect x="0" y="0" width="114" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="57" y="26" text-anchor="middle" class="pill">Project</text>
      <rect x="132" y="0" width="114" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="189" y="26" text-anchor="middle" class="pill">Issue</text>
      <rect x="264" y="0" width="114" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="321" y="26" text-anchor="middle" class="pill">Comment</text>
      <rect x="0" y="62" width="114" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="57" y="88" text-anchor="middle" class="pill">Status</text>
      <rect x="132" y="62" width="114" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="189" y="88" text-anchor="middle" class="pill">Review</text>
      <rect x="264" y="62" width="114" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="321" y="88" text-anchor="middle" class="pill">Artifact</text>
    </g>
  </g>

  <!-- Execution plane -->
  <g transform="translate(718 342)">
    <rect x="0" y="0" width="450" height="236" rx="20" fill="#f0fdf4" stroke="#86efac" class="node soft"/>
    <text x="30" y="44" class="plane-title">执行平面</text>
    <text x="30" y="72" class="small">面向 agent 和 runtime，负责短周期任务、工具启动和结果产出。</text>

    <g transform="translate(30 106)">
      <rect x="0" y="0" width="114" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="57" y="26" text-anchor="middle" class="pill">Agent</text>
      <rect x="132" y="0" width="114" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="189" y="26" text-anchor="middle" class="pill">Task Queue</text>
      <rect x="264" y="0" width="114" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="321" y="26" text-anchor="middle" class="pill">Runtime</text>
      <rect x="0" y="62" width="114" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="57" y="88" text-anchor="middle" class="pill">work_dir</text>
      <rect x="132" y="62" width="114" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="189" y="88" text-anchor="middle" class="pill">session_id</text>
      <rect x="264" y="62" width="114" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="321" y="88" text-anchor="middle" class="pill">AI Tools</text>
    </g>
  </g>

  <!-- Plane relation arrows -->
  <path d="M562 423 H718" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="640" y="398" text-anchor="middle" class="section-title">创建 Agent Task</text>
  <text x="640" y="417" text-anchor="middle" class="tiny">@agent / assign / rerun</text>

  <path d="M718 502 H562" stroke="#9333ea" stroke-width="2.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="640" y="538" text-anchor="middle" class="section-title">结果回写</text>
  <text x="640" y="556" text-anchor="middle" class="tiny">comment / artifact / status</text>

  <!-- Governance lines -->
  <path d="M330 248 V342" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M950 248 V342" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowGray)"/>
  <text x="330" y="292" text-anchor="middle" class="tiny">governs</text>
  <text x="950" y="292" text-anchor="middle" class="tiny">governs</text>

  <!-- Bottom summary -->
  <g transform="translate(154 646)">
    <rect x="0" y="0" width="972" height="48" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="36" y="30" class="small">读图方式：</text>
    <text x="112" y="30" class="small">协作平面负责长期状态</text>
    <circle cx="278" cy="25" r="3" fill="#9ca3af"/>
    <text x="296" y="30" class="small">执行平面负责短周期任务</text>
    <circle cx="480" cy="25" r="3" fill="#9ca3af"/>
    <text x="498" y="30" class="small">治理平面负责权限、配置、注册和审计</text>
    <circle cx="760" cy="25" r="3" fill="#9ca3af"/>
    <text x="778" y="30" class="small">所有结果回到看板和 Issue</text>
  </g>
</svg>
