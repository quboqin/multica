# Self-hosting Docker Compose — starts PostgreSQL, backend, and frontend.
#
# Services bind to 127.0.0.1 only. For cross-machine or public access, front
# them with a reverse proxy (Caddy / nginx / Cloudflare Tunnel) that terminates
# TLS and forwards to 127.0.0.1:8080 (backend) and 127.0.0.1:3000 (frontend).
# Do NOT change these bindings to 0.0.0.0 — Docker bypasses host firewalls
# (UFW/iptables) by default, so the raw ports would be exposed to the internet
# with the default JWT_SECRET and Postgres credentials. See:
#   apps/docs/content/docs/self-host-quickstart.mdx
#
# Usage:
#   cp .env.example .env
#   # Edit .env — change JWT_SECRET at minimum
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Frontend: http://localhost:${FRONTEND_PORT:-3000}
# Backend:  http://localhost:${BACKEND_PORT:-${API_PORT:-${SERVER_PORT:-${PORT:-8080}}}}

name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${MULTICA_POSTGRES_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      crawler-worker:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-${API_PORT:-${SERVER_PORT:-${PORT:-8080}}}}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      GOMEMLIMIT: ${MULTICA_BACKEND_GO_MEMORY_LIMIT:-384MiB}
      METRICS_ADDR: ${METRICS_ADDR:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-3000}/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Public URL the API is reachable at from the open internet, no
      # trailing slash. Used to mint absolute webhook URLs for autopilot
      # webhook triggers. Leave unset behind a same-origin reverse proxy
      # (e.g. plain localhost dev); the frontend will compose the URL
      # from window.origin + webhook_path in that case. Headers are
      # intentionally NOT used to derive this value, to avoid Host /
      # X-Forwarded-Host spoofing on misconfigured proxies.
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:-}
      # Comma-separated CIDRs whose source IP is allowed to set
      # X-Forwarded-For / X-Real-IP for the webhook per-IP rate limiter.
      # Empty default = headers ignored, RemoteAddr used. Set e.g.
      # "127.0.0.1/32" when running behind a same-host reverse proxy.
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-}
      MULTICA_BROKER_WORKER_URL: http://crawler-worker:19516
      MULTICA_BROKER_WORKER_TIMEOUT: ${MULTICA_BROKER_WORKER_TIMEOUT:-120s}
      MULTICA_BROKER_CRAWL_TIMEOUT: ${MULTICA_BROKER_CRAWL_TIMEOUT:-15m}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,crawler-worker,multica-direct-postgres,multica-crawler-worker
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,crawler-worker,multica-direct-postgres,multica-crawler-worker
      MULTICA_CREDENTIAL_CONNECTORS_JSON: ${MULTICA_CREDENTIAL_CONNECTORS_JSON:-}
      MULTICA_CREATIVE_ARCHIVE_INTERVAL: ${MULTICA_CREATIVE_ARCHIVE_INTERVAL:-3s}
      MULTICA_CREATIVE_ARCHIVE_MAX_BYTES: ${MULTICA_CREATIVE_ARCHIVE_MAX_BYTES:-104857600}
      MULTICA_CREATIVE_ARCHIVE_ALLOWED_HOSTS: ${MULTICA_CREATIVE_ARCHIVE_ALLOWED_HOSTS:-creative-ag-global-esa.umcdn.cn}
      MULTICA_CREATIVE_ASSET_PUBLIC_BASE_URL: ${MULTICA_CREATIVE_ASSET_PUBLIC_BASE_URL:-}
    mem_limit: ${MULTICA_BACKEND_MEMORY_LIMIT:-640m}
    restart: unless-stopped

  crawler-worker:
    image: ${MULTICA_CRAWLER_WORKER_IMAGE:-ghcr.io/multica-ai/multica-crawler-worker}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CRAWLER_WORKER_PORT:-19516}:19516"
    environment:
      CRAWLER_WORKER_BROWSER_PROXY: ${CRAWLER_WORKER_BROWSER_PROXY:-}
      PORT: "19516"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      MULTICA_API_URL: http://backend:8080
      CRAWLER_WORKER_REMOTE_UI: "true"
      CRAWLER_WORKER_PUBLIC_URL: ${CRAWLER_WORKER_PUBLIC_URL:-http://localhost:${CRAWLER_WORKER_PORT:-19516}}
      CRAWLER_WORKER_HEADLESS: ${CRAWLER_WORKER_HEADLESS:-false}
      CRAWLER_WORKER_CRAWL_HEADLESS: ${CRAWLER_WORKER_CRAWL_HEADLESS:-false}
      BROKER_STATE_KEY: ${BROKER_STATE_KEY:?BROKER_STATE_KEY must be a base64-encoded 32-byte key}
      MULTICA_CREDENTIAL_CONNECTORS_JSON: ${MULTICA_CREDENTIAL_CONNECTORS_JSON:-}
      APP_ENV: ${APP_ENV:-production}
      NODE_OPTIONS: --max-old-space-size=${MULTICA_CRAWLER_WORKER_NODE_HEAP_MB:-384}
      CRAWLER_WORKER_MAX_OPEN_BROWSERS: ${CRAWLER_WORKER_MAX_OPEN_BROWSERS:-1}
      CRAWLER_WORKER_CRAWL_BROWSER_TIMEOUT_MS: ${CRAWLER_WORKER_CRAWL_BROWSER_TIMEOUT_MS:-900000}
      APPGROWING_MATERIAL_SEARCH_BUDGET_MS: ${APPGROWING_MATERIAL_SEARCH_BUDGET_MS:-720000}
      APPGROWING_GRAPHQL_TIMEOUT_MS: ${APPGROWING_GRAPHQL_TIMEOUT_MS:-12000}
      APPGROWING_BROWSER_FALLBACK_MIN_BUDGET_MS: ${APPGROWING_BROWSER_FALLBACK_MIN_BUDGET_MS:-75000}
    mem_limit: ${MULTICA_CRAWLER_WORKER_MEMORY_LIMIT:-2200m}
    restart: unless-stopped

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: --max-old-space-size=${MULTICA_FRONTEND_NODE_HEAP_MB:-320}
    mem_limit: ${MULTICA_FRONTEND_MEMORY_LIMIT:-384m}
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
